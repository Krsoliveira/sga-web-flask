{% extends "base.html" %}

{% block title %}Gestão de Categorias{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 text-gray-800">Categorias de Auditoria</h1>
    <a href="{{ url_for('nova_categoria') }}" class="btn btn-primary shadow-sm">
        <i class="fas fa-plus me-2"></i>Nova Categoria
    </a>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome da Categoria</th>
                    <th class="text-center" style="width: 150px;">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categorias %}
                <tr>
                    <td>{{ cat.id }}</td>
                    <td>{{ cat.nome }}</td>
                    <td class="text-center">
                        <form action="{{ url_for('deletar_categoria', id=cat.id) }}" method="POST" onsubmit="return confirm('Tem certeza? Isso pode afetar relatórios existentes.');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="fas fa-trash"></i> Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-center text-muted">Nenhuma categoria cadastrada.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
