{% extends "base.html" %}
{% block title %}Criar Novo Usuário{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">Adicionar Novo Usuário</h1>

    <form action="{{ url_for('criar_usuario') }}" method="POST">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="codigo" class="form-label">Código do Colaborador</label>
                <input type="text" class="form-control" id="codigo" name="codigo" required>
            </div>
            <div class="col-md-6">
                <label for="nome_completo" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome_completo" name="nome_completo" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="senha" class="form-label">Senha Provisória</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="col-md-6">
                <label for="role" class="form-label">Papel</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="" selected disabled>Selecione um papel...</option>
                    {% for role in roles %}
                        <option value="{{ role }}">{{ role }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="gerente_id" class="form-label">Gerente Direto (Opcional)</label>
            <select class="form-select" id="gerente_id" name="gerente_id">
                <option value="">Nenhum</option>
                {% for gerente in gerentes %}
                    <option value="{{ gerente.id }}">{{ gerente.nome_completo }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="d-flex justify-content-end mt-4">
            <a href="{{ url_for('gestao_usuarios') }}" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-primary">Criar Usuário</button>
        </div>
    </form>
{% endblock %}
