{% extends "base.html" %}

{% block title %}Editar Atividade{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('ver_relatorio', id_caso=caso.id) }}">Relatório {{ caso.numero_relatorio_display }}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Editar Atividade</li>
            </ol>
        </nav>

        <div class="card shadow mb-4 border-left-primary">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">Editar Detalhes da Atividade</h6>
            </div>
            
            <div class="card-body">
                <form method="POST">
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Descrição da Atividade (Processo)</label>
                        <select class="form-select" name="atividade_desc" required>
                            {% for op in opcoes_atividade %}
                                <option value="{{ op }}" {{ 'selected' if atividade.atividade_desc == op else '' }}>{{ op }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Período Início</label>
                            <input type="date" class="form-control" name="periodo_inicio" value="{{ atividade.periodo_inicio or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Período Fim</label>
                            <input type="date" class="form-control" name="periodo_fim" value="{{ atividade.periodo_fim or '' }}">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Extensão dos Exames</label>
                            <input type="text" class="form-control" name="extensao_exames" value="{{ atividade.extensao_exames or '' }}" placeholder="Ex: 100% dos itens, 5 amostras...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Critério de Amostragem</label>
                            <input type="text" class="form-control" name="criterio_amostragem" value="{{ atividade.criterio_amostragem or '' }}" placeholder="Ex: Aleatório, Itens de alto valor...">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Testes Realizados</label>
                        <textarea class="form-control" name="testes_realizados" rows="3">{{ atividade.testes_realizados or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Constatação / Fatos Observados</label>
                        <textarea class="form-control" name="observacao_resumo" rows="3">{{ atividade.observacao_resumo or '' }}</textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-danger">Ponto de Não Conformidade</label>
                            <textarea class="form-control border-danger" name="nao_conformidade" rows="3" placeholder="Se houver erro, descreva qual norma foi quebrada.">{{ atividade.nao_conformidade or '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-success">Recomendação / Plano de Ação</label>
                            <textarea class="form-control border-success" name="recomendacao" rows="3" placeholder="O que deve ser feito para corrigir?">{{ atividade.recomendacao or '' }}</textarea>
                        </div>
                    </div>

                    <hr>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Situação / Conclusão</label>
                        <select class="form-select bg-light border-dark" name="situacao" required>
                            {% for sit in opcoes_situacao %}
                                <option value="{{ sit }}" {{ 'selected' if atividade.situacao == sit else '' }}>{{ sit }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('ver_relatorio', id_caso=caso.id) }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Salvar Alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
