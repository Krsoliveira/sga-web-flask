{% extends "base.html" %}
{% block title %}{% if categoria %}Editar Categoria{% else %}Nova Categoria{% endif %}{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">
        {% if categoria %}
            Editar Categoria: {{ categoria.nome }}
        {% else %}
            Criar Nova Categoria
        {% endif %}
    </h1>

    <form method="POST">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome da Categoria</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ categoria.nome if categoria else '' }}" required>
        </div>
        
        <div class="d-flex justify-content-end">
            <a href="{{ url_for('gestao_categorias') }}" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
{% endblock %}
