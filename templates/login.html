<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .card-login { border: none; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
        .card-header { background: white; padding: 30px 20px 10px; text-align: center; border-bottom: none; }
        .btn-custom { background-color: #2c3e50; color: white; width: 100%; padding: 10px; border-radius: 5px; font-weight: bold; }
        .btn-custom:hover { background-color: #1a252f; color: white; }
    </style>
</head>
<body>
    <div class="card card-login">
        <div class="card-header">
            <i class="fas fa-tasks fa-3x text-primary mb-3"></i>
            <h4 class="fw-bold text-dark">SGA Auditoria</h4>
            <p class="text-muted small">Insira suas credenciais</p>
        </div>
        <div class="card-body p-4 bg-white">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">CÓDIGO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="codigo" class="form-control border-start-0" placeholder="Ex: ADMIN" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">SENHA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="senha" class="form-control border-start-0" placeholder="Sua senha" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-custom">ENTRAR</button>
            </form>
        </div>
        <div class="card-footer bg-light text-center py-3 border-0">
            <small class="text-muted">SGA &copy; 2026</small>
        </div>
    </div>
</body>
</html>
